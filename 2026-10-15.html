<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IELTS 每日新聞練習</title>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--ink:#1d2433;--muted:#5d6779;--line:#e2e7f0;
  --brand:#2b59ff;--brand-ink:#fff;--brand-soft:#e8edff;
  --ok:#0f9d58;--ok-soft:#e3f6ec;--bad:#d93025;--bad-soft:#fdeaea;--hl:#fff1a8;--vocab:#d6e4ff;
  --radius:16px;--shadow:0 2px 10px rgba(30,45,90,.07);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141c;--card:#1a2030;--ink:#e8ecf5;--muted:#9aa5ba;--line:#2a3347;--brand:#6c8cff;--brand-ink:#0b1020;--brand-soft:#243059;
  --ok:#4cc38a;--ok-soft:#173b2b;--bad:#ff6b60;--bad-soft:#412121;--hl:#6b5d12;--vocab:#2c3e6e;--shadow:none}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 60px}
header.hero{background:linear-gradient(135deg,#2b59ff,#6a3df0);color:#fff;border-radius:var(--radius);padding:20px 18px;box-shadow:var(--shadow)}
.hero .date{font-size:.85rem;opacity:.9;letter-spacing:.02em}
.hero h1{font-size:1.35rem;line-height:1.35;margin:6px 0 10px}
.hero a{color:#fff;font-size:.85rem;text-decoration:underline;word-break:break-all}
.hero .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:.75rem;margin-bottom:6px}
nav.tabs{display:flex;gap:8px}
nav.tabs button{flex:1;padding:11px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
section.panel[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:.8rem}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;min-height:42px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,select:focus-visible,input:focus-visible,.flip:focus-visible,.opt:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.spread{justify-content:space-between}
select{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);min-height:42px}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:12px 0 4px}
.bar>i{display:block;height:100%;width:0;background:var(--brand);transition:width .25s}
.muted{color:var(--muted);font-size:.85rem}
.warn{background:var(--bad-soft);color:var(--bad);padding:8px 12px;border-radius:10px;font-size:.88rem;margin-top:10px}
.transcript{margin-top:12px;font-size:1.02rem;line-height:1.9}
.sent{padding:2px 3px;border-radius:6px;cursor:pointer;transition:background .15s}
.sent.cur{background:var(--hl)}
.vw{background:var(--vocab);border-bottom:2px solid var(--brand);border-radius:4px;padding:0 2px;cursor:help}
.defbox{margin-top:12px;border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 12px;border-radius:8px;font-size:.92rem}
.defbox b{font-size:1.02rem}
/* flashcards */
.flip{display:block;width:100%;perspective:1000px;background:none;border:0;padding:0;cursor:pointer;height:250px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;gap:6px;overflow:auto}
.face.front{background:var(--brand-soft)}
.face.back{background:var(--card);transform:rotateY(180deg);font-size:.95rem}
.face .w{font-size:1.9rem;font-weight:800}
.face .pos{color:var(--muted);font-style:italic}
.face .zh{font-size:1.3rem;font-weight:700;color:var(--brand)}
.face .ex{color:var(--muted);font-style:italic;font-size:.9rem}
.face .hint{font-size:.78rem;color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;padding:1px 8px;border-radius:999px;background:var(--ok-soft);color:var(--ok);font-weight:700}
/* quiz */
.q{font-size:1.05rem;font-weight:600;margin:6px 0 12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:46px}
.opt:hover:not(:disabled){border-color:var(--brand)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.picked{border-color:var(--brand)}
input.txt{padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);min-width:0;flex:1;min-height:44px;width:100%}
input.txt.right{border-color:var(--ok);background:var(--ok-soft)}
input.txt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.93rem}
.fb.right{background:var(--ok-soft);color:var(--ok)}
.fb.wrong{background:var(--bad-soft);color:var(--bad)}
.fb .ex{color:var(--ink);margin-top:4px}
.fb q{font-style:italic;color:var(--muted)}
.score{font-size:2.4rem;font-weight:800;text-align:center;color:var(--brand);margin:6px 0}
/* reading */
.passage p{margin:0 0 14px;font-family:Georgia,"Times New Roman","Noto Serif TC",serif;font-size:1.04rem;line-height:1.85}
.passage .lab{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:6px;font-weight:800;padding:0 8px;margin-right:8px;font-family:-apple-system,"Segoe UI",sans-serif}
.w{cursor:pointer;border-radius:3px}
.w.hl{background:var(--hl)}
.timer{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:800}
.timer.late{color:var(--bad)}
.rq{border-top:1px solid var(--line);padding:14px 0}
.rq:first-of-type{border-top:0}
.tf{display:flex;gap:8px;flex-wrap:wrap}
.tf .opt{width:auto;flex:1 1 90px;text-align:center;margin:4px 0}
.instr{background:var(--brand-soft);padding:8px 12px;border-radius:10px;font-size:.85rem;margin-bottom:6px}
footer{text-align:center;color:var(--muted);font-size:.78rem;margin-top:20px}
@media (max-width:420px){.hero h1{font-size:1.2rem}.face .w{font-size:1.6rem}}

/* ---- exam paper styles ---- */
.wrap.wide{max-width:1200px}
.paperhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px}
.paperhead b{font-size:1.1rem;letter-spacing:.04em}
.modes{display:flex;gap:6px;margin-bottom:10px}
.modes button{flex:1;padding:9px 6px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-weight:600;cursor:pointer}
.modes button[aria-pressed=true]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.status{background:var(--brand-soft);border-left:4px solid var(--brand);border-radius:8px;padding:10px 12px;margin:10px 0;font-family:Georgia,"Times New Roman",serif;font-size:1.02rem}
.status .cd{float:right;font-variant-numeric:tabular-nums;font-weight:800;font-family:-apple-system,sans-serif}
input[type=range]{width:100%;accent-color:var(--brand);margin:10px 0 2px}
.grp{margin:0 0 22px;font-family:Georgia,"Times New Roman","Noto Serif TC",serif}
.gh{font-weight:800;font-size:1.05rem;margin-bottom:4px}
.gi{font-size:.97rem;line-height:1.55;margin-bottom:12px;white-space:pre-wrap}
.notes{border:2px solid var(--ink);border-radius:4px;padding:12px 14px;line-height:2.15}
.notes .nt{text-align:center;font-weight:800;font-size:1.02rem;margin-bottom:4px}
.notes .nh{font-weight:800;margin-top:6px}
.notes .nl{padding-left:1.1em;text-indent:-1.1em}
.notes .nl::before{content:"• ";}
.notes.plain .nl{padding-left:0;text-indent:0}.notes.plain .nl::before{content:""}
.bl{width:7.6em;max-width:100%;font-family:-apple-system,"Segoe UI",sans-serif;font-size:.95rem;padding:2px 6px;margin:0 3px;border:0;border-bottom:2px solid var(--ink);border-radius:0;background:var(--brand-soft);min-height:28px;text-align:center}
.bl::placeholder{color:var(--ink);font-weight:800;opacity:.75}
.bl.right{background:var(--ok-soft);border-color:var(--ok)}.bl.wrong{background:var(--bad-soft);border-color:var(--bad)}
.qi{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;font-family:Georgia,"Times New Roman","Noto Serif TC",serif}
.qn{flex:none;min-width:2em;height:2em;line-height:2em;border:2px solid var(--ink);text-align:center;font-weight:800;font-family:-apple-system,sans-serif;font-size:.9rem}
.qt{flex:1;min-width:0}
.qi select{font-family:-apple-system,sans-serif;min-width:5.5em;flex:none}
.qi select.right{border-color:var(--ok);background:var(--ok-soft)}.qi select.wrong{border-color:var(--bad);background:var(--bad-soft)}
.mcopt{display:block;margin:4px 0}
.review{margin-top:8px}
.rc{border-radius:10px;padding:8px 12px;margin:8px 0;font-size:.92rem;font-family:-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
.rc.right{background:var(--ok-soft)}.rc.wrong{background:var(--bad-soft)}
.rc q{display:block;font-style:italic;color:var(--muted);margin-top:4px;font-family:Georgia,serif}
.rc .ps{margin-left:6px;min-height:28px;padding:0 8px;font-size:.8rem}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:6px}
.cell{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.85rem;cursor:pointer;background:var(--card);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cell b{margin-right:6px;color:var(--brand)}
.cell.empty{opacity:.6}.cell.right{border-color:var(--ok);background:var(--ok-soft)}.cell.wrong{border-color:var(--bad);background:var(--bad-soft)}
.result{text-align:center;margin:10px 0}
.result .score{margin:2px 0}
.band{display:inline-block;background:var(--brand);color:var(--brand-ink);border-radius:999px;padding:4px 16px;font-weight:800;font-size:1.2rem}
.rdhead{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:12px;position:sticky;top:100px;z-index:4;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.rdhead .timer{font-size:1.3rem}
.split{display:block}
.pane h3{margin:0 0 4px;font-size:1.15rem;font-family:Georgia,"Times New Roman",serif}
.pane .intro{font-style:italic;margin:0 0 14px;font-family:Georgia,serif;color:var(--muted)}
@media (min-width:900px){
  .split{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .pane{max-height:calc(100vh - 150px);overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
}
@media (max-width:899px){.pane.qs{padding-top:4px}}
@media (max-width:420px){.bl{width:6.4em}.notes{padding:10px}}
.fcsrc{font-size:.72rem;color:var(--muted)}


/* ---- two-story layout ---- */
.hero .stl{margin:8px 0 0;font-size:.92rem;line-height:1.45;opacity:.97}
.hero .stl b{background:rgba(255,255,255,.22);border-radius:6px;padding:0 6px;margin-right:6px}
.plan{border-left:5px solid var(--brand)}
.plan summary{margin-bottom:6px}
.plan .blk{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--brand-soft);font-size:.93rem}
.plan .blk b.h{display:block;font-size:.98rem;margin-bottom:2px}
.plan .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.plan .chip2{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;cursor:pointer;min-height:32px}
.plan .chip2.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.plan .tot{font-size:.85rem;color:var(--muted);margin-top:6px}
.stick{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0 4px;margin:0 0 6px}
nav.tabs{position:static;margin:0 0 6px;padding:0}
nav.tabs button small{display:block;font-weight:400;font-size:.7rem;opacity:.85}
nav.stories{display:flex;gap:8px}
nav.stories button{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;cursor:pointer;text-align:left;line-height:1.25}
nav.stories button b{display:block;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.stories button span{display:block;font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.stories button[aria-selected=true]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand);background:var(--brand-soft)}
.storyhead{margin:0 0 10px;font-size:.88rem}
.storyhead h2{font-size:1.02rem;margin:0 0 4px;line-height:1.35}
.storyhead .acc{display:inline-block;background:var(--brand-soft);border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:700;margin-right:6px}
.storyhead a{color:var(--brand);word-break:break-word}
.storyhead details{margin-top:4px}
.rdhead{top:calc(var(--stk,104px) + 2px)}
@media (max-width:899px){.rdhead{top:calc(var(--stk,104px) + 2px)}}

</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header class="hero">
    <span class="tag">IELTS 每日新聞練習 · 目標 7.0</span>
    <div class="date" id="hDate"></div>
    <h1>今日兩篇新聞練習 · Two stories</h1>
    <div class="stl" id="hStories"></div>
  </header>
  <details class="card plan" id="plan" style="margin-top:14px" open></details>
  <div class="stick" id="stick">
    <nav class="tabs" role="tablist" id="secNav">
      <button role="tab" aria-selected="true" data-sec="listen">🎧 Listening<small>通勤</small></button>
      <button role="tab" aria-selected="false" data-sec="read">📖 Reading<small>休息時間</small></button>
      <button role="tab" aria-selected="false" data-sec="vocab">🗂 單字<small>隨時</small></button>
    </nav>
    <nav class="stories" id="storyNav" role="tablist" aria-label="Story"></nav>
  </div>
  <div class="storyhead card" id="storyHead"></div>
  <div id="stories"></div>
  <template id="tpl">
  <!-- LISTENING -->
  <section class="panel" id="listen" data-sec="listen" hidden>
    <div class="card">
      <div class="paperhead"><b>LISTENING · SECTION 4</b><span class="muted" id="lMeta"></span></div>
      <div class="modes" role="group" aria-label="模式">
        <button id="mExam" aria-pressed="true">考試模式（只播一次）</button>
        <button id="mPrac" aria-pressed="false">練習模式（可重播）</button>
      </div>
      <audio id="au" preload="metadata"></audio>
      <div class="status" id="lStatus">Section 4 – you will hear a lecture. Before the recording starts you have 30 seconds to look at the questions; after it ends you have 30 seconds to check your answers. The recording will be played <b>once only</b>.<span class="cd" id="lCd"></span></div>
      <div class="row" id="examCtl">
        <button class="btn primary" id="btnStart">▶ 開始考試</button>
        <button class="btn" id="btnSkip" hidden>略過等待 →</button>
      </div>
      <div id="pracCtl" hidden>
        <div class="row">
          <button class="btn primary" id="btnPlay">▶ 播放</button>
          <button class="btn" id="btnReplay">⟲ 重播</button>
          <label class="row muted">速度
            <select id="selRate" aria-label="語速"><option value="0.8">0.8x</option><option value="1" selected>1x</option><option value="1.2">1.2x</option></select>
          </label>
        </div>
        <input type="range" id="seek" min="0" max="1000" value="0" aria-label="播放進度">
        <div class="row spread muted"><span id="tCur">0:00</span><span id="plText"></span><span id="tDur">0:00</span></div>
      </div>
      <div id="examBar" hidden><div class="bar"><i id="plBar"></i></div><div class="muted" id="exTime"></div></div>
      <div class="warn" id="audioWarn" hidden>音檔載入失敗，請檢查網路後重新整理頁面。</div>
    </div>
    <div class="card">
      <div class="paperhead"><b id="lTitle"></b><span class="muted">Questions 31–40</span></div>
      <div id="lQs"></div>
    </div>
    <div class="card" id="lSheetCard">
      <h2>🧾 Answer Sheet <small id="lSheetInfo"></small></h2>
      <div class="sheet" id="lSheet"></div>
      <div class="row" style="margin-top:12px"><button class="btn primary" id="lSubmit">提交答案</button><button class="btn" id="lReset">重新作答</button></div>
      <div id="lResult"></div>
    </div>
    <div class="card" id="transCard" hidden>
      <h2>📜 逐字稿 Transcript</h2>
      <div class="row"><button class="btn" id="btnTrans" aria-pressed="false">顯示逐字稿</button><span class="muted" id="transHint">點選句子可從該句開始播放；藍色底線單字可查看解釋。</span></div>
      <div id="transWrap" hidden><div class="transcript" id="transcript"></div><div class="defbox" id="defbox" hidden></div></div>
    </div>
  </section>

  <!-- READING -->
  <section class="panel" id="read" data-sec="read" hidden>
    <div class="rdhead">
      <div><b>READING PASSAGE 1</b> <span class="muted">You should spend about <span id="tmSug"></span> minutes on Questions 1–13.</span></div>
      <div class="row"><span class="timer" id="tmShow">20:00</span>
        <button class="btn primary" id="tmStart" style="min-height:36px">開始計時</button><button class="btn" id="tmPause" style="min-height:36px">暫停</button></div>
    </div>
    <div class="split">
      <div class="pane passage" id="paneP">
        <h3 id="rdTitle"></h3><p class="intro" id="rdIntro"></p>
        <div id="passage"></div>
        <div class="row spread"><span class="muted">點擊單字可標記螢光筆</span><button class="btn" id="hlClear" style="min-height:34px;padding:4px 10px">清除標記</button></div>
      </div>
      <div class="pane qs" id="paneQ">
        <div id="rQs"></div>
        <div class="card" style="margin-top:8px">
          <h2>🧾 Answer Sheet <small id="rSheetInfo"></small></h2>
          <div class="sheet" id="rSheet"></div>
          <div class="row" style="margin-top:12px"><button class="btn primary" id="rSubmit">提交答案</button><button class="btn" id="rReset">重新作答</button></div>
          <div id="rResult"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- VOCAB -->
  <section class="panel" id="vocab" data-sec="vocab" hidden>
    <div class="card">
      <h2>🗂 單字卡 <small id="fcCount"></small></h2>
      <button class="flip" id="flip" aria-label="翻轉單字卡"><div class="in">
        <div class="face front"><div class="w" id="fcWord"></div><div class="pos" id="fcPos"></div><div class="fcsrc" id="fcSrc"></div><div class="hint">點擊翻面</div></div>
        <div class="face back" id="fcBack"></div>
      </div></button>
      <div class="row spread" style="margin-top:12px">
        <button class="btn" id="fcPrev" aria-label="上一張">←</button>
        <button class="btn" id="fcSpeak">🔊 發音</button>
        <button class="btn" id="fcNext" aria-label="下一張">→</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn bad" id="fcNo" style="flex:1">✗ 不認識</button>
        <button class="btn ok" id="fcYes" style="flex:1">✓ 認識</button>
      </div>
      <div class="bar"><i id="fcBar"></i></div>
      <div class="row spread"><span class="muted" id="fcKnown"></span><button class="btn" id="fcReset" style="min-height:34px;padding:4px 10px">重設</button></div>
    </div>
    <div class="card"><h2>📋 單字總表</h2><div id="vList"></div></div>
  </section>
  </template>
  <footer>音檔為神經網路語音（Microsoft Edge TTS）· 進度分篇儲存在本機 (localStorage)</footer>

      "text": "Few regions have seen energy use expand as quickly as Southeast Asia. According to the International Energy Agency's ASEAN Energy Security Review, published in early October 2026, the region's total energy demand has increased by more than 40 per cent since 2015, while electricity demand has risen by more than 60 per cent. About 97 per cent of households now have access to electricity, putting ASEAN on track for universal access by 2030. Fossil fuels nonetheless remain dominant. In 2025, coal and oil each accounted for around 30 per cent of the region's total energy supply and natural gas for close to one fifth, whereas bioenergy and waste contributed around 12 per cent, wind, solar and other renewables around 7 per cent, and hydropower around 3 per cent."

(function(){

const gid=id=>document.getElementById(id);

const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
const fmtT=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const fmtC=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
/* ================= generic exam engine ================= */
const norm=s=>String(s).toLowerCase().trim().replace(/^\$\s*/,"").replace(/\s*%$/,"").replace(/[.,;!?]+$/,"").replace(/\s+/g," ");
const BANDS={
 R:[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]],
 L:[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]]};
function bandOf(kind,raw,total){
  const s40=Math.round(raw/total*40);let b=2;
  for(const [m,v] of BANDS[kind]){if(s40>=m){b=v;break}}
  return {s40,b:b.toFixed(1)};
}
function buildTest(o){
  const K=o.P+o.kind; // o:{kind,groups,st,root,sheet,sheetInfo,result,submitBtn,resetBtn,onSubmit,onReset,total}

      h+=`<div class="notes${g.bullets?"":" plain"}">`+(g.heading?`<div class="nt">${esc(g.heading)}</div>`:"");
      g.lines.forEach(l=>{
        if(l.h)h+=`<div class="nh">${esc(l.h)}</div>`;
        else h+=`<div class="nl">`+esc(l.t).replace(/\[\[(\d+)\]\]/g,(m,k)=>{const n=g.from+ +k-1;return `<input class="bl" id="${K}q${n}" data-n="${n}" type="text" placeholder="${n}" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Question ${n}">`})+`</div>`;
      });
      h+=`</div>`;

    }else{
      g.items.forEach((it,i)=>{
        const n=g.from+i;Qs.push({n,g,it,gi});
        h+=`<div class="qi" id="${K}q${n}"><span class="qn">${n}</span><div class="qt">${esc(it.q)}`;
        if(g.type==="mc")h+=it.options.map((op,j)=>`<label class="mcopt"><input type="radio" name="${K}r${n}" data-n="${n}" value="${j}"> <b>${"ABCD"[j]}.</b> ${esc(op)}</label>`).join("");
        h+=`</div>`;
        if(g.type==="match")h+=`<select data-n="${n}" aria-label="Question ${n}"><option value="">–</option>${g.options.map(x=>`<option>${x}</option>`).join("")}</select>`;
        if(g.type==="tfng")h+=`<select data-n="${n}" aria-label="Question ${n}"><option value="">–</option><option value="True">TRUE</option><option value="False">FALSE</option><option value="Not Given">NOT GIVEN</option></select>`;
        h+=`</div>`;
      });
    }

  }).join("");
  o.root.innerHTML=html;
  const ans=o.st.ans;
  const q=n=>Qs.find(x=>x.n===n);
  const correct=(x,v)=>{
    if(v===undefined||v==="")return false;
    if(x.g.type==="mc")return +v===x.it.a;
    if(x.g.type==="blanks")return x.it.a.map(norm).includes(norm(v));
    return String(v)===x.it.a;
  };
  const shownAns=x=>x.g.type==="mc"?"ABCD"[x.it.a]:x.g.type==="blanks"?x.it.a[0]:x.it.a;
  const field=n=>{

  };
  function renderSheet(){
    o.sheet.innerHTML=Qs.map(x=>{
      const v=ans[x.n];let t=v===undefined||v===""?"—":(x.g.type==="mc"?"ABCD"[+v]:v);
      const cls=o.st.done?(correct(x,v)?"right":"wrong"):(v===undefined||v===""?"empty":"");
      return `<div class="cell ${cls}" data-n="${x.n}" title="${esc(t)}"><b>${x.n}</b>${esc(t)}</div>`;

  }

  o.root.addEventListener("input",e=>{const t=e.target;if(!t.dataset||!t.dataset.n||o.st.done)return;ans[t.dataset.n]=t.value;o.save();renderSheet()});
  o.root.addEventListener("change",e=>{const t=e.target;if(!t.dataset||!t.dataset.n||o.st.done)return;ans[t.dataset.n]=t.value;o.save();renderSheet()});
  function restore(){
    Qs.forEach(x=>{
      const v=ans[x.n];if(v===undefined)return;
      if(x.g.type==="mc"){const r=o.root.querySelector(`input[name="${K}r${x.n}"][value="${v}"]`);if(r)r.checked=true}
      else{const f=field(x.n);if(f)f.value=v}

  }

    o.groups.forEach((g,gi)=>{

        const v=ans[x.n],ok=correct(x,v);
        const mine=v===undefined||v===""?"（未作答）":(x.g.type==="mc"?"ABCD"[+v]:v);
        const f=x.g.type==="blanks"?document.querySelector(`#${K}q${x.n}`):o.root.querySelector(`#${K}q${x.n} select`);
        if(f){f.classList.remove("right","wrong");f.classList.add(ok?"right":"wrong")}
        const loc=x.it.si!==undefined?`<button class="btn ps" data-si="${x.it.si}">▶ 聽這句</button>`:(x.it.ref?`（段落 ${esc(x.it.ref)}）`:"");
        return `<div class="rc ${ok?"right":"wrong"}"><b>Q${x.n} ${ok?"✔":"✘"}</b> 你的答案：${esc(mine)}${ok?"":`　｜　正確答案：<b>${esc(shownAns(x))}</b>`}<div>${esc(x.it.zh)}</div>${x.it.ev?`<q>${esc(x.it.ev)}</q>`:""}${loc}</div>`;

  }

    o.st.done=true;o.save();lock(true);review();renderSheet();const raw=result();

  }
  o.submitBtn.onclick=()=>{
    if(o.st.done)return;

  };

  o.submitBtn.disabled=false;o.result.innerHTML="";

  return o.api;
}

function initStory(S,idx,root,P,hooks){

  const items=[];
  S.vocab.forEach((v,i)=>(v.match&&v.match.length?v.match:[v.word]).forEach(m=>items.push({m,i})));
  items.sort((a,b)=>b.m.length-a.m.length);
  return items.length?{re:new RegExp("(?<![A-Za-z])("+items.map(x=>x.m.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![A-Za-z])","gi"),items}:null;
})();
(function(){
  const box=$("transcript");let gi=0;
  S.script.forEach(para=>{
    const p=document.createElement("p");p.style.margin="0 0 12px";
    para.forEach(s=>{
      const sp=document.createElement("span");sp.className="sent";sp.dataset.i=gi++;
      let html="",last=0;
      if(VR)s.replace(VR.re,(m,g,off)=>{html+=esc(s.slice(last,off));const it=VR.items.find(x=>x.m.toLowerCase()===m.toLowerCase());html+=`<span class="vw" data-v="${it?it.i:0}">${esc(m)}</span>`;last=off+m.length;return m});
      html+=esc(s.slice(last));sp.innerHTML=html;p.appendChild(sp);p.appendChild(document.createTextNode(" "));
    });
    box.appendChild(p);
  });
})();
$("transcript").addEventListener("click",e=>{
  const vw=e.target.closest(".vw");
  if(vw){const v=S.vocab[+vw.dataset.v];const d=$("defbox");d.hidden=false;
    d.innerHTML=`<b>${esc(v.word)}</b> <i class="muted">${esc(v.pos)}</i><br>${esc(v.def)}<br><b style="color:var(--brand)">${esc(v.zh)}</b>`;return}
  const se=e.target.closest(".sent");
  if(se){const i=+se.dataset.i;au.playbackRate=+$("selRate").value;playFrom(Math.max(0,TM[i][0]-0.1))}
});
$("btnTrans").onclick=()=>{
  const show=$("transWrap").hidden;$("transWrap").hidden=!show;
  $("btnTrans").textContent=show?"隱藏逐字稿":"顯示逐字稿";$("btnTrans").setAttribute("aria-pressed",show);
};
mountL();
phase=mode==="exam"?(store.L.done?"done":"idle"):"idle";
setPhase(phase);paint();

/* ================= READING ================= */
const R=S.reading;
$("tmSug").textContent=R.minutes;$("rdTitle").textContent=R.title;$("rdIntro").textContent=R.intro||"";
(function(){
  const box=$("passage");
  R.passage.forEach((p,pi)=>{
    const el=document.createElement("p");el.style.cssText="margin:0 0 14px;font-family:Georgia,'Times New Roman','Noto Serif TC',serif;font-size:1.04rem;line-height:1.85";
    const lab=document.createElement("span");lab.className="lab";lab.textContent=p.label;el.id=P+"para"+p.label;el.appendChild(lab);
    p.text.split(/(\s+)/).forEach((t,ti)=>{
      if(!t)return;if(/^\s+$/.test(t)){el.appendChild(document.createTextNode(" "));return}
      const w=document.createElement("span");w.className="w";w.textContent=t;const k=pi+"-"+ti;w.dataset.k=k;
      if(store.R.hl.includes(k))w.classList.add("hl");el.appendChild(w);
    });
    box.appendChild(el);
  });
})();
$("passage").addEventListener("click",e=>{
  const w=e.target.closest(".w");if(!w)return;
  w.classList.toggle("hl");const k=w.dataset.k,i=store.R.hl.indexOf(k);
  if(i>=0)store.R.hl.splice(i,1);else store.R.hl.push(k);save();
});
$("hlClear").onclick=()=>{store.R.hl=[];save();root.querySelectorAll(".w.hl").forEach(x=>x.classList.remove("hl"))};
/* timer */
const tm={running:false,left:R.minutes*60,elapsed:0,h:null};
function tmRender(){$("tmShow").textContent=tm.left<=0?"Time up":fmtC(tm.left);$("tmShow").classList.toggle("late",tm.left<=60);
  $("tmStart").textContent=tm.running?"…計時中":(tm.elapsed?"繼續":"開始計時");$("tmStart").disabled=tm.running||store.R.done||tm.left<=0}
function stopTimer(){if(tm.h){clearInterval(tm.h);tm.h=null}tm.running=false;tmRender()}
function tmReset(){stopTimer();tm.left=R.minutes*60;tm.elapsed=0;tmRender()}
$("tmStart").onclick=()=>{if(tm.running||tm.left<=0)return;tm.running=true;
  tm.h=setInterval(()=>{tm.left--;tm.elapsed++;if(tm.left<=0){tm.left=0;stopTimer();Rtest.api&&Rtest.api.finish()}tmRender()},1000);tmRender()};
$("tmPause").onclick=stopTimer;
const Rtest={api:null};
function mountR(){
  Rtest.api=buildTest({P,save,kind:"R",groups:R.groups,st:store.R,root:$("rQs"),sheet:$("rSheet"),sheetInfo:$("rSheetInfo"),result:$("rResult"),
    submitBtn:$("rSubmit"),resetBtn:$("rReset"),
    extra:()=>tm.elapsed?`<p class="muted">用時 ${fmtC(tm.elapsed)}（建議 ${R.minutes} 分鐘）</p>`:"",
    onSubmit:()=>{stopTimer();changed()},onReset:()=>{tmReset();changed()}});
}
mountR();tmRender();

/* ================= VOCAB ================= */
const V=S.vocab;let fc=0;
const wordAudio=i=>S.audio.words?S.audio.words+String(i).padStart(2,"0")+".mp3":null;
function renderCard(){
  const v=V[fc];if(!v)return;$("flip").classList.remove("on");
  $("fcWord").textContent=v.word;$("fcPos").textContent=v.pos;$("fcSrc").textContent=v.src?"出處：" + v.src:"";
  const known=store.known.includes(v.word);
  $("fcBack").innerHTML=`<div><b>${esc(v.word)}</b> <span class="pos">${esc(v.pos)}</span> ${known?'<span class="chip">已會</span>':""}</div><div>${esc(v.def)}</div><div class="zh">${esc(v.zh)}</div><div class="ex">“${esc(v.example)}”</div>`;
  $("fcCount").textContent=`第 ${fc+1} / ${V.length} 張`;
  const k=store.known.filter(w=>V.some(x=>x.word===w)).length;
  $("fcKnown").textContent=`已會 ${k} / ${V.length}`;$("fcBar").style.width=100*k/V.length+"%";
}
$("flip").onclick=()=>$("flip").classList.toggle("on");
$("fcPrev").onclick=()=>{fc=(fc-1+V.length)%V.length;renderCard()};
$("fcNext").onclick=()=>{fc=(fc+1)%V.length;renderCard()};
let wa=null;
$("fcSpeak").onclick=()=>{const s=wordAudio(fc);if(!s)return;if(wa)wa.pause();wa=new Audio(s);wa.play().catch(()=>{})};
if(!S.audio.words)$("fcSpeak").hidden=true;
function mark(known){const w=V[fc].word,i=store.known.indexOf(w);
  if(known&&i<0)store.known.push(w);if(!known&&i>=0)store.known.splice(i,1);save();renderCard();setTimeout(()=>{fc=(fc+1)%V.length;renderCard()},250)}
$("fcYes").onclick=()=>mark(true);$("fcNo").onclick=()=>mark(false);
$("fcReset").onclick=()=>{store.known=[];save();renderCard()};
if(V.length)renderCard();
$("vList").innerHTML=V.map((v,i)=>`<div class="rc" style="background:var(--brand-soft)"><b>${esc(v.word)}</b> <i class="muted">${esc(v.pos)}</i> <span class="chip" style="background:var(--card);color:var(--muted)">${esc(v.src||"")}</span><div>${esc(v.def)}</div><div><b style="color:var(--brand)">${esc(v.zh)}</b></div><div class="muted"><i>“${esc(v.example)}”</i></div></div>`).join("");
return {store,au,pause:()=>{au.pause()},inExam:()=>phase==="pre"||phase==="play"||phase==="post",abortExam:()=>{clearCd();au.pause();au.currentTime=0;if(!store.L.done){setPhase("idle")}},
  practiceMode:()=>mode==="practice",Ltest:()=>Ltest,Rtest:()=>Rtest.api,listenMin:()=>Math.ceil((S.audio.duration+60)/60),readMin:()=>S.reading.minutes};
}

/* ================= page glue: stories x sections ================= */
const STORIES=DATA.stories, ST=[];
const REVIEW_L=3, REVIEW_R=5;     // minutes allowed for reviewing answers (listening / reading)
let curSec="listen", curStory=0;
function accentLine(S){return S.audio.accent||S.audio.voice}
(function header(){
  const d=new Date(DATA.date+"T00:00:00");const wk=["日","一","二","三","四","五","六"];
  gid("hDate").textContent=isNaN(d)?DATA.date:`${d.getFullYear()} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日（星期${wk[d.getDay()]}）`;
  gid("hStories").innerHTML=STORIES.map((S,i)=>`<div><b>Story ${i+1}</b>${esc(S.title)}</div>`).join("");
  document.title="IELTS "+DATA.date+" | "+STORIES.map(s=>s.title.split(":")[0]).join(" / ");
  gid("storyNav").innerHTML=STORIES.map((S,i)=>`<button role="tab" data-story="${i}" aria-selected="${i===0}"><b>Story ${i+1} · ${esc(S.topic||"")}</b><span>${esc(accentLine(S))}</span></button>`).join("");
})();
const hooks={changed:()=>plan(),guard:(idx)=>{
  for(let j=0;j<ST.length;j++){ if(j===idx||!ST[j])continue;
    if(ST[j].inExam()){ if(!confirm(`Story ${j+1} 的考試錄音仍在進行中。開始 Story ${idx+1} 會中止它，確定嗎？`))return false; ST[j].abortExam(); }
    else ST[j].pause();
  } return true;}};
const tpl=gid("tpl").innerHTML;
STORIES.forEach((S,i)=>{
  const P="s"+(i+1)+"-";
  const box=document.createElement("div");box.id=P+"root";box.innerHTML=tpl.replace(/\bid="([^"]+)"/g,(m,a)=>`id="${P}${a}"`);
  gid("stories").appendChild(box);
  ST[i]=initStory(S,i,box,P,hooks);
});
function scoreChip(kind,i){
  const st=ST[i],t=kind==="L"?st.Ltest():st.Rtest(),done=kind==="L"?st.store.L.done:st.store.R.done;
  return done&&t?`✔ ${t.score()}/${t.total}`:"";
}
function plan(){
  const lm=STORIES.map((S,i)=>ST[i].listenMin()),rm=STORIES.map((S,i)=>ST[i].readMin());
  const commute=lm.reduce((a,b)=>a+b+REVIEW_L,0),brk=rm.reduce((a,b)=>a+b+REVIEW_R,0);
  const chip=(sec,i,label)=>{const k=sec==="listen"?"L":"R",sc=scoreChip(k,i);
    return `<button class="chip2${sc?" done":""}" data-go="${sec}:${i}">${label} ${sc}</button>`};
  gid("plan").innerHTML=`<summary style="cursor:pointer;font-weight:800;font-size:1.05rem">⏱ 今日時間規劃 <small class="muted" style="font-weight:400">共約 ${commute+brk} 分鐘，分兩段完成（點此收合／展開）</small></summary>
  <div class="blk"><b class="h">🚇 通勤（約 ${commute} 分鐘）：只做聽力</b>
    Story 1 聽力（考試流程：閱題 30 秒 + 錄音 ${fmtT(STORIES[0].audio.duration)} + 檢查 30 秒 ≈ ${lm[0]} 分）→ 核對答案 ${REVIEW_L} 分 →
    Story 2 聽力（≈ ${lm[1]} 分）→ 核對答案 ${REVIEW_L} 分。若通勤還有餘裕：用「練習模式」重聽、看逐字稿，或翻單字卡。
    <div class="chips">${chip("listen",0,"🎧 Story 1 聽力")}${chip("listen",1,"🎧 Story 2 聽力")}</div></div>
  <div class="blk"><b class="h">☕ 休息時間（約 ${brk} 分鐘，可拆開做）：兩篇閱讀</b>
    每篇限時 ${rm[0]} 分鐘 + 檢討約 ${REVIEW_R} 分鐘（Story 1 ≈ ${rm[0]+REVIEW_R} 分、Story 2 ≈ ${rm[1]+REVIEW_R} 分）。
    <div class="chips">${chip("read",0,"📖 Story 1 閱讀")}${chip("read",1,"📖 Story 2 閱讀")}</div></div>
  <div class="tot">時間為估算：聽力含 30 秒閱題與 30 秒檢查；實際依作答與檢討速度而定。單字卡（每篇 ${STORIES[0].vocab.length} 個）可零碎時間複習。</div>`;
}
function show(sec,story,noScroll){
  curSec=sec;curStory=story;
  document.querySelectorAll("#secNav button").forEach(b=>b.setAttribute("aria-selected",b.dataset.sec===sec));
  document.querySelectorAll("#storyNav button").forEach(b=>b.setAttribute("aria-selected",+b.dataset.story===story));
  ST.forEach((st,i)=>{
    ["listen","read","vocab"].forEach(s=>{const el=gid("s"+(i+1)+"-"+s);el.hidden=!(i===story&&s===sec)});
    if(st.practiceMode()&&!(i===story&&sec==="listen"))st.pause();
  });
  gid("wrap").classList.toggle("wide",sec==="read");
  const S=STORIES[story],src=S.source,links=(src.links||[]).map(l=>`<li><a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.name)} ↗</a></li>`).join("");
  gid("storyHead").innerHTML=`<h2>Story ${story+1} · ${esc(S.title)}</h2><span class="acc">🎙 ${esc(accentLine(S))}</span><span class="muted">來源：<a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.name)} ↗</a></span>${links?`<details><summary class="muted">更多來源</summary><ul style="margin:4px 0 0;padding-left:18px">${links}</ul></details>`:""}`;
  try{history.replaceState(null,"","#"+sec+"-"+(story+1))}catch(e){}
  fixStick();
}
function fixStick(){const h=gid("stick").offsetHeight;document.documentElement.style.setProperty("--stk",h+"px")}
document.querySelectorAll("#secNav button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.sec,curStory)));
document.querySelectorAll("#storyNav button").forEach(b=>b.addEventListener("click",()=>show(curSec,+b.dataset.story)));
gid("plan").addEventListener("click",e=>{const c=e.target.closest("[data-go]");if(!c)return;const [s,i]=c.dataset.go.split(":");show(s,+i);gid("stick").scrollIntoView({behavior:"smooth"})});
addEventListener("resize",fixStick);
plan();
const hm=(location.hash||"").match(/^#(listen|read|vocab)-(\d)$/);
show(hm?hm[1]:"listen",hm&&STORIES[+hm[2]-1]?+hm[2]-1:0);
setTimeout(fixStick,300);
})();
</script>
<!-- refresh button (standalone/home-screen mode has no reload button) -->
<style>
.rfb{position:fixed;z-index:60;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));width:32px;height:32px;margin:0;padding:0;border:1px solid rgba(127,127,127,.35);border-radius:50%;background:rgba(127,127,127,.14);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);color:inherit;font:400 18px/1 -apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.6;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
/* lesson pages: the sticky tab bar spans the top on narrow screens (and in wide Reading mode below 1260px) -> bottom-right there */
.rfb-l{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:840px){.rfb-l{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto}}
@media (min-width:840px) and (max-width:1259px){#wrap.wide~.rfb-l{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
.rfb:hover,.rfb:focus-visible,.rfb:active{opacity:1}
</style>
<button type="button" class="rfb rfb-l" id="rfb" aria-label="重新整理" title="重新整理">↻</button>
<script>
(function(){var b=document.getElementById("rfb");if(!b)return;b.addEventListener("click",function(){
  var q=new URLSearchParams(location.search);q.delete("v");q.set("v",String(Date.now()));
  location.replace(location.pathname+"?"+q.toString()+location.hash);
});})();
</script>
</body>
